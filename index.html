<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meteo App - Tejaswini Samanta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/styles.css" />
</head>
<body>
    <div class="weather-app">
    <header>
        <form class="search-form" id="search-form">
            <input type="search" 
            placeholder="Enter a city.." 
            required
            class="search-form-input"
            id="search-form-input"
            />
            <input type="submit" 
            value="Search"
            class="search-form-button"
            />
        </form>
    </header>

    <main>
        <div class="weather-app-data">
        <div>
        <h1 class="weather-app-city" id="city">Paris</h1>
        <p class="weather-app-details">
            Friday 12:52, scattered clouds
            <br />
            Humidity: <strong>68%</strong> Wind: <strong>2.06km/h</strong>
        </p>
        </div>
        <div class="weather-app-temperature-container">
            <div class="weather-app-icon"></div>
            <div class="weather-app-temperature">12</div>
            <div class="weather-app-unit">°C</div>
        </div>
        </div>
    </main>
    <footer>
        Coded by <a href="https://tejaswinisamanta.github.io/">Tejaswini Samanta</a> 
        and is open-sourced on <a href="https://github.com/tejaswinisamanta/meteo-app">GitHub</a> 
        and hosted on <a href="https://meteoapp-js.netlify.app/">Netlify</a>
    </footer>
    </div>

    <script src="src/index.js"></script>
</body>
</html>
